; Makerfabs ESP32-S3 Parallel TFT with Touch 3.5" ILI9488 (v2.0)
; Module: ESP32-S3-WROOM-1-N16R2 (16 MB quad flash, 2 MB quad PSRAM)
; Serial terminal (VT100/xterm emulator) over USB CDC-ACM. ESP-IDF, no LVGL.
;
; Two USB-C ports, two jobs:
;   CP2104  -> UART0  : flashing + IDF logs (this file's upload/monitor port)
;   native  -> CDC-ACM: the terminal link to the Linux host (/dev/ttyACM0)

[platformio]
; Native ESP-IDF layout: app sources live in main/ (the IDF "main" component).
src_dir = main

[env:makerfabs_s3_parallel_tft35]
platform = espressif32@6.13.0        ; ships ESP-IDF v5.5.3
framework = espidf
; Base ESP32-S3-DevKitC-1; our module is N16R2 (16 MB quad flash, 2 MB quad PSRAM).
; Flash size + PSRAM (quad) are driven by sdkconfig.defaults under the espidf framework.
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Ports are auto-detected. Once the terminal firmware is running, the board
; presents TWO serial devices — the CP2104 (for flashing and logs) and its own
; CDC-ACM terminal link — so auto-detection can pick the wrong one. If an upload
; fails or the monitor shows nothing, name the CP2104 port explicitly here:
;
;   upload_port  = /dev/ttyUSB0            ; Linux   (macOS: /dev/cu.usbserial-*)
;   monitor_port = /dev/ttyUSB0            ; never the ttyACM*/usbmodem* one

build_flags =
    -DBOARD_MAKERFABS_S3_TFT35_V20
